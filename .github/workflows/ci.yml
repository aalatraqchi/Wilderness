name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LÖVE
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb

      # Boots the game in a virtual display and plays through every stage.
      - name: Smoke test
        env:
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" love . --smoke
